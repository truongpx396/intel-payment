version: "2"
run:
  timeout: 5m
  # Lint the integration tests too: they are half of what verifies the money path, and they were
  # invisible to the linter until now.
  build-tags: [ integration, clients ]
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - revive
    - rowserrcheck
    # Tests run in parallel by default (`go test -race` under GOMAXPROCS): a test that cannot must
    # say why with `//nolint:paralleltest // <reason>`, which makes shared state a reviewed decision.
    - paralleltest
    - tparallel
    # The contract bans time.Now in the core: a core that reads the wall clock is not replayable.
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: inject the Clock port — a core that reads the wall clock is not replayable
    depguard:
      rules:
        layers-use-ports-only:
          list-mode: lax
          files:
            - '**/billing/**'
            - '**/entitlement/**'
          deny:
            - pkg: github.com/truongpx396/intel-payment/metering/app
              desc: mint credits via the Meter/Ledger port, not app internals
            - pkg: github.com/truongpx396/intel-payment/metering/adapters/driven
              desc: do not reach into metering's infra adapters
        # The fiat core is as portable as the engine: no database, cache, broker, transport or provider SDK in the
        # layers that decide. Adapters implement the ports; the core never learns what is behind them.
        billing-core-pure:
          list-mode: lax
          files:
            - '**/billing/domain/**'
            - '**/billing/ports/**'
            - '**/billing/app/**'
          deny:
            - pkg: github.com/redis/go-redis
              desc: no infra in the fiat core; use a port
            - pkg: github.com/jackc/pgx
              desc: no infra in the fiat core; use a store port
            - pkg: github.com/nats-io
              desc: no broker in the fiat core; use the Bus port
            - pkg: google.golang.org/grpc
              desc: no transport in the fiat core
            - pkg: github.com/stripe/stripe-go
              desc: no provider SDK near the core; see billing/adapters/driven/stripe
        # The domain is vocabulary and arithmetic: the standard library and metering's domain, nothing else.
        billing-domain-is-pure:
          list-mode: strict
          files:
            - '**/billing/domain/**'
            - '!$test'
          allow:
            - $gostd
            - github.com/truongpx396/intel-payment/metering/domain
        metering-core-pure:
          list-mode: lax
          files:
            - '**/metering/domain/**'
            - '**/metering/ports/**'
            - '**/metering/app/**'
          deny:
            - pkg: github.com/redis/go-redis
              desc: no infra in the core; use the BalanceStore driven port
            - pkg: github.com/jackc/pgx
              desc: no infra in the core; use the BookStore driven port
            - pkg: github.com/nats-io
              desc: no broker in the core; use the Bus driven port
            - pkg: google.golang.org/grpc
              desc: no transport in the core; grpc lives in adapters/driving
            - pkg: net/http
              desc: no transport in the core
            - pkg: github.com/stripe/stripe-go
              desc: no provider SDK near the core; see billing/adapters/driven/stripe
        metering-is-standalone:
          list-mode: lax
          files:
            - '**/metering/**'
          deny:
            - pkg: github.com/truongpx396/intel-payment/billing
              desc: metering/ must stand alone — fiat depends on it, never the reverse
            - pkg: github.com/truongpx396/intel-payment/entitlement
              desc: metering/ must stand alone
            - pkg: github.com/truongpx396/intel-payment/events
              desc: metering/ must stand alone — hosts hear about events through events/, which depends on metering
            - pkg: github.com/truongpx396/intel-payment/cmd
              desc: the core never imports its own wiring
        # The wire contract is a leaf: generated code and its checks import protobuf and gRPC, never the
        # engine. (go-arch-lint lets api reach metering-driving through dependency injection only.)
        api-is-a-leaf:
          list-mode: lax
          files:
            - '**/api/**'
            - '!$test'
          deny:
            - pkg: github.com/truongpx396/intel-payment
              desc: api/ is the wire contract — it imports nothing of the module it describes
        # Transports share `auth` and `wire` (go-arch-lint lets metering-driving build on its own siblings)
        # and nothing else of each other: a client that imported the server, or a REST handler that reached
        # into a gRPC transport, would be a second path to the engine that skips what the first one checks.
        grpcclient-is-a-client:
          list-mode: lax
          files: [ '**/driving/grpcclient/**' ]
          deny:
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/grpcserver, desc: a client does not import a server }
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/resthandler, desc: "transports share auth and wire, nothing else" }
        grpcserver-is-a-server:
          list-mode: lax
          files: [ '**/driving/grpcserver/**' ]
          deny:
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/grpcclient, desc: a server does not import a client }
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/resthandler, desc: "transports share auth and wire, nothing else" }
        resthandler-is-rest:
          list-mode: lax
          files: [ '**/driving/resthandler/**' ]
          deny:
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/grpcserver, desc: "transports share auth and wire, nothing else" }
            - { pkg: github.com/truongpx396/intel-payment/metering/adapters/driving/grpcclient, desc: "transports share auth and wire, nothing else" }
        provider-sdk-containment:
          list-mode: lax
          files:
            - '**'
            - '!**/billing/adapters/driven/stripe/**'
            - '!**/billing/adapters/driven/polar/**'
            - '!**/billing/adapters/driven/paypal/**'
          deny:
            - pkg: github.com/stripe/stripe-go
              desc: a provider SDK belongs only in its own adapter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # forbidigo guards the CORE only; adapters and cmd own the real clock.
      - linters: [ forbidigo ]
        path-except: metering/(domain|ports|app)/
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
