# Self-contained local deployment: `make up` from the repo root.
# The Redis flags are not tuning — they are correctness. See docs/configuration.md.
name: intel-payment

x-env: &env
  PAYMENT_REALM:             ${PAYMENT_REALM:-default}
  PAYMENT_BALANCE_REDIS_URL: redis://payment:dev-payment@redis:6379/0
  PAYMENT_LEDGER_DSN:        postgres://payment:payment@postgres:5432/payment?sslmode=disable
  PAYMENT_SHARDS:            ${PAYMENT_SHARDS:-256}
  PAYMENT_BUS:               ${PAYMENT_BUS:-redis_streams}
  PAYMENT_BUS_URL:           ${PAYMENT_BUS_URL:-}
  PAYMENT_SETTLEMENT:        ${PAYMENT_SETTLEMENT:-outbox}
  PAYMENT_HOT_ACK_WAIT:      ${PAYMENT_HOT_ACK_WAIT:-none}
  PAYMENT_LEDGER_GRANULARITY: ${PAYMENT_LEDGER_GRANULARITY:-event}
  PAYMENT_USAGE_IDEM_WINDOW: ${PAYMENT_USAGE_IDEM_WINDOW:-72h}
  PAYMENT_ADMIT_FAIL_POLICY: ${PAYMENT_ADMIT_FAIL_POLICY:-fail_closed}
  PAYMENT_NEGATIVE_BALANCE_POLICY: ${PAYMENT_NEGATIVE_BALANCE_POLICY:-clamp_to_zero}
  PAYMENT_CREDIT_EXPIRY:     ${PAYMENT_CREDIT_EXPIRY:-off}
  PAYMENT_TAX_STRATEGY:      ${PAYMENT_TAX_STRATEGY:-provider_managed}
  PAYMENT_SERVICE_AUTH:      ${PAYMENT_SERVICE_AUTH:-bearer}
  PAYMENT_SERVICE_TOKENS:    ${PAYMENT_SERVICE_TOKENS:-}
  # Provider secrets, REFERENCED by provider_accounts rows (e.g. `env:STRIPE_SECRET_KEY`).
  STRIPE_SECRET_KEY:         ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET:     ${STRIPE_WEBHOOK_SECRET:-}
  POLAR_ACCESS_TOKEN:        ${POLAR_ACCESS_TOKEN:-}
  POLAR_WEBHOOK_SECRET:      ${POLAR_WEBHOOK_SECRET:-}
  PAYPAL_CLIENT_ID:          ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET:      ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_WEBHOOK_ID:         ${PAYPAL_WEBHOOK_ID:-}
  PAYMENT_LOG_LEVEL:         ${PAYMENT_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["${PAYMENT_POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction + AOF: this store holds balances, the outbox STREAMS and idempotency guards, and
    # write access to it is the ability to mint credits. An LRU policy here turns a cache eviction
    # into a billing incident. The port is published for local development only: in production no
    # principal but paymentd and payment-worker may reach it (docs/security.md).
    # The ACL leaves `default` OFF: hosts have no credential (deploy/redis/users.acl).
    command: >
      redis-server --appendonly yes --appendfsync everysec
                   --maxmemory-policy noeviction
                   --aclfile /etc/redis/users.acl
    volumes:
      - redisdata:/data
      - ./redis/users.acl:/etc/redis/users.acl:ro
    ports: ["${PAYMENT_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "healthcheck", "--pass", "dev-health", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10

  # OPTIONAL. The default bus is Redis Streams, so nothing below runs unless you ask:
  #   docker compose --profile jetstream up -d
  #   PAYMENT_BUS=nats_jetstream PAYMENT_BUS_URL=nats://nats:4222
  nats:
    profiles: ["jetstream"]
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    volumes: ["natsdata:/data"]
    ports: ["4222:4222"]

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/payment-migrate", "up"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  paymentd:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      <<: *env
      PAYMENT_HTTP_ADDR: ":8080"
      PAYMENT_GRPC_ADDR: ":9090"
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      # /readyz fails while the schema is behind head, so an orchestrator will not
      # route traffic to a service that would serve money against a half-migrated DB.
      test: ["CMD", "/usr/local/bin/paymentd", "healthcheck"]
      interval: 10s
      retries: 6

  # The SOLE durable writer. Replicas divide the shards between them (one owner per shard, by
  # Postgres advisory lock); never run it in a request-serving tier.
  payment-worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/payment-worker"]
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }

volumes: { pgdata: {}, redisdata: {}, natsdata: {} }
