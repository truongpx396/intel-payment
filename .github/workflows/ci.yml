name: CI
on:
  push: { branches: [ main ] }
  pull_request:
  schedule:
    - cron: '23 2 * * *'   # nightly: deep fuzzing and whole-target mutation testing, and a fresh govulncheck
  workflow_dispatch:

permissions: { contents: read }

jobs:
  go:
    name: build · test · boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # '1.26' resolves to the latest 1.26.x patch. go-version-file would pin go.mod's `go 1.26.0`
        # — the OLDEST 1.26, whose standard library can carry vulnerabilities govulncheck reports.
        with: { go-version: '1.26', cache: true }

      - name: Build
        run: go build ./...

      # -shuffle: a test that depends on another's side effects fails here, not in a rebase.
      # Tests are t.Parallel (the paralleltest linter enforces it); goleak guards TestMain.
      - name: Test (units + conformance suites)
        run: go test -race -count=1 -shuffle=on ./...

      # Testcontainers: a real PostgreSQL, so the migrator is tested against what it migrates.
      - name: Integration (Testcontainers)
        run: go test -race -count=1 -shuffle=on -tags=integration ./...

      - name: golangci-lint (incl. depguard boundary rules)
        uses: golangci/golangci-lint-action@v9
        with: { version: v2.14 }   # must be built with a Go >= the module's `go` line

      - name: Architecture graph
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          go-arch-lint check --project-path .

      # The gates must FAIL when crossed: plant a violation per rule and expect rejection.
      - name: Boundary gates reject violations
        run: scripts/verify-boundary.sh

      # SC-006: the engine must never depend on the fiat or entitlement layers.
      - name: Verify portability
        run: make verify-portability

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Test-driven development, with the evidence checkable (docs/testing.md; constitution principle X).
  red-green:
    name: test-driven (a failing test-only commit precedes the change)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }          # the script reads the branch's commits and checks each one out
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      # A branch that changes production code needs a tests-only commit BEFORE it that FAILS, and a tip
      # that passes it. A test written after the code passes where it appears and is refused. A change
      # that cannot be test-driven says so with `TDD-Exempt: <reason>` in a commit or the PR body.
      - name: Red, then green
        env: { PR_BODY: '${{ github.event.pull_request.body }}' }
        run: scripts/verify-red-green.sh "origin/${{ github.base_ref }}"

  # The gates above judge every pull request, so they are shown to REFUSE what they exist to refuse
  # (scripts/verify-boundary.sh does the same for the architecture gates).
  tdd-gates:
    name: TDD gates reject violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Plant violations, expect refusal
        run: scripts/verify-tdd-gates.sh

  fuzz:
    name: fuzz (arithmetic, encodings, time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      # The seed corpus already runs in the `go` job; this searches beyond it. Nightly it searches longer.
      - name: Fuzz every target
        env: { FUZZTIME: "${{ github.event_name == 'schedule' && '10m' || '20s' }}" }
        run: scripts/fuzz.sh
      # A failing input is a regression test once committed: download it, commit it with the fix.
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: fuzz-failing-inputs, path: '**/testdata/fuzz', if-no-files-found: ignore }

  mutation:
    name: mutation (do the tests fail when the code is wrong?)
    # Pull requests run the diff gate; the nightly run and a manual dispatch run every target.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      # Pinned: scripts/mutation.sh parses gremlins' summary, so a format change must be a reviewed change.
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Only the lines this pull request committed
        if: github.event_name == 'pull_request'
        run: scripts/mutation.sh --diff "origin/${{ github.base_ref }}"
      - name: Every target, against its thresholds
        if: github.event_name != 'pull_request'
        run: scripts/mutation.sh

  deploy:
    name: image · migrate · redis ACL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the distroless/non-root image, brings an EMPTY Postgres to head with payment-migrate
      # (and asserts `check` agrees), and proves the Redis ACL by attempting what it forbids.
      - name: Verify the deployment
        run: scripts/verify-deploy.sh

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: svc
        run: echo "present=$([ -d cmd/paymentd ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      # The suite drives the REAL stack, so it activates with cmd/paymentd (Phase 1). Until then
      # the job still type-checks and lists the tests, so the suite cannot rot unseen.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - run: npm ci
        working-directory: e2e
      - run: npx tsc --noEmit && npx playwright test --list
        working-directory: e2e
      - name: Start the stack
        if: steps.svc.outputs.present == 'yes'
        run: make up && for i in $(seq 1 60); do curl -sf localhost:8080/readyz && break; sleep 2; done
      - name: Run e2e
        if: steps.svc.outputs.present == 'yes'
        working-directory: e2e
        env: { CI: 'true', E2E_BASE_URL: 'http://localhost:8080' }
        run: npx playwright test
      - name: Upload report
        if: always() && steps.svc.outputs.present == 'yes'
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: e2e/playwright-report, if-no-files-found: ignore }
      - name: Stack logs on failure
        if: failure() && steps.svc.outputs.present == 'yes'
        run: docker compose -f deploy/docker-compose.yml logs --tail 200 || true

  migrations:
    name: schema (apply · seed · assert · phase-2 draft)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: payment, POSTGRES_PASSWORD: payment, POSTGRES_DB: payment }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U payment" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Applies every shipped migration to a clean PostgreSQL 16, seeds a realm, and asserts
      # BEHAVIOUR — the idempotency guards, insert-only rate cards, database-written audit rows,
      # partitions created ahead of need — then applies the Phase 2 DRAFT on top and asserts its
      # immutability triggers. A schema is verified by applying it (constitution XI).
      - name: Verify the schema
        env:
          PGPASSWORD: payment
          PSQL: psql -h localhost -U payment -d payment
        run: scripts/verify-schema.sh

  hot-path:
    name: hot path on Redis Cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the reference Redis Functions against Redis 7 in CLUSTER MODE, where a script that
      # touches two hash slots is refused — the constraint the key layout exists to satisfy.
      - name: Verify the reference hot path
        run: scripts/verify-hot-path.sh

  drift:
    name: spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No retired mechanism described as current
        run: scripts/check-spec-drift.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  docs:
    name: contract links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No dangling relative markdown links
        run: |
          fail=0
          while IFS= read -r f; do
            grep -oE '\]\(\.[^)#]*\.(md|sql|excalidraw)' "$f" | sed 's/^](//' | while read -r l; do
              t="$(cd "$(dirname "$f")" && printf '%s' "$(realpath -m "$l")")"
              [ -e "$t" ] || { echo "DANGLING: $f -> $l"; exit 1; }
            done || fail=1
          done < <(find . -name '*.md' -not -path './node_modules/*')
          exit $fail
