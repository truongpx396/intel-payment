# The hexagon's dependency graph, machine-enforced.
# The two load-bearing facts: metering-domain depends on NOTHING (so it is portable by
# construction), and billing/entitlement may depend on metering's PORTS but never its app
# or adapters — so the fiat layer mints credits through the interface, exactly as any
# other host would, and cannot reach around it.
version: 3
workdir: .
excludeFiles:
  - "^.*_test\\.go$"        # tests may import their own package from outside it
allow:
  depOnAnyVendor: true      # infra SDKs are gated by depguard, not here

components:
  metering-domain:  { in: metering/domain }
  metering-ports:   { in: metering/ports }
  metering-app:     { in: metering/app }
  metering-driven:  { in: metering/adapters/driven/** }
  metering-driving: { in: metering/adapters/driving/** }
  metering-config:  { in: metering }
  # Conformance suites: importable by an adapter's own tests, given constructors — they import no adapter.
  metering-contracts: { in: metering/contracts }
  # The fiat layer is laid out as the engine is: domain -> ports -> app -> adapters, one direction.
  billing:           { in: billing }                      # the root package: documentation only
  billing-domain:    { in: billing/domain }
  billing-ports:     { in: billing/ports }
  billing-app:       { in: billing/app }
  billing-driven:    { in: billing/adapters/driven/** }   # postgres, then stripe, polar and paypal
  billing-driving:   { in: billing/adapters/driving/** }  # the webhook door
  # Conformance suites: importable by an adapter's own tests, given constructors — they import no adapter.
  billing-contracts: { in: billing/contracts/** }   # the suites, the in-memory world, and each provider's fixtures
  entitlement:      { in: entitlement/** }
  events:           { in: events/** }
  api:              { in: api/** }
  migrate:          { in: migrate }
  testsupport:      { in: internal/** }   # containers and fault injection for tests; imports migrations so tests run against the real schema
  migrations:       { in: migrations }
  cmd:              { in: cmd/** }

deps:
  # metering-domain and migrations are deliberately ABSENT from deps: a component with no entry may
  # depend on no other component. metering-domain depends on NOTHING — portable by construction.
  migrate:          { mayDependOn: [ migrations ] }
  testsupport:      { mayDependOn: [ migrate, migrations ] }
  metering-ports:   { mayDependOn: [ metering-domain ] }
  metering-config:  { mayDependOn: [ metering-domain ] }
  metering-contracts: { mayDependOn: [ metering-domain, metering-ports, metering-config ] }
  metering-app:     { mayDependOn: [ metering-domain, metering-ports, metering-config ] }
  metering-driven:  { mayDependOn: [ metering-domain, metering-ports, metering-config, metering-contracts,
                                     metering-driven ] }    # an adapter may build on a sibling (pricing → table); contracts: only from tests
  # A transport may build on a sibling: grpcserver, grpcclient and the REST handler share `auth` (who is
  # calling) and `wire` (the status table and the message converters), as driven adapters share `pricing`.
  # What stays forbidden — one transport reaching into another — is a depguard rule (.golangci.yml).
  metering-driving: { mayDependOn: [ metering-domain, metering-ports, metering-config, api,
                                     metering-driving ] }
  # api is generated wire code. Its Register…Server takes the transport as an interface and calls it, which
  # the dependency-injection check reads as api → metering-driving. That is the only edge api may have in
  # this graph; that api IMPORTS nothing of this module is a depguard rule (api-is-a-leaf, .golangci.yml),
  # because the graph alone would now allow `import driving` from api.
  api:              { mayDependOn: [ metering-driving ] }
  billing:           { mayDependOn: [ metering-domain, metering-ports ] }
  billing-domain:    { mayDependOn: [ metering-domain ] }
  billing-ports:     { mayDependOn: [ billing-domain, metering-domain, metering-ports ] }
  billing-app:       { mayDependOn: [ billing-domain, billing-ports, metering-domain, metering-ports ] }
  billing-contracts: { mayDependOn: [ billing-domain, billing-ports, metering-domain, metering-ports, metering-contracts, billing-contracts ] }
  # An adapter implements billing's ports and reaches metering through its ports. That no provider adapter imports
  # another is a depguard rule (.golangci.yml): this graph cannot tell stripe from postgres.
  billing-driven:    { mayDependOn: [ billing-domain, billing-ports, metering-domain, metering-ports, billing-driven ] }
  # A door speaks HTTP for a port: it reaches the use cases only through billing's ports, and is mounted by cmd.
  billing-driving:   { mayDependOn: [ billing-ports, billing-domain, billing-driving ] }
  entitlement:      { mayDependOn: [ metering-domain, metering-ports, api ] }   # also implements metering's QuotaSource
  events:           { mayDependOn: [ metering-domain, api ] }                  # outbound delivery to hosts
  # cmd/** includes cmd/internal, the helpers the binaries share (the environment reader, the store wiring), so a
  # binary depends on its own component.
  cmd:              { mayDependOn: [ cmd, metering-domain, metering-ports, metering-config,
                                     metering-app, metering-driven, metering-driving,
                                     billing-domain, billing-ports, billing-app, billing-driven, billing-driving,
                                     entitlement, events, api,
                                     migrate, migrations ] }
